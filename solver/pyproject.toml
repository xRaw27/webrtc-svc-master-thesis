[project]
name = "sfu-alloc"
version = "0.1.0"
description = "Fair allocation of SVC quality levels in a WebRTC SFU (master's thesis)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pyomo>=6.8",
    "highspy>=1.7",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sfu_alloc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
# Explicit select (not extend-select) so the rule set does not drift
# with ruff's changing defaults.
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "NPY", "RUF"]
